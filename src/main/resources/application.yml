spring:
  config:
    import: "${APP_ENV_IMPORT:optional:file:.env[.properties]}"
  application:
    name: am-erica-backend
  profiles:
    default: local
  mail:
    host: ${SMTP_SERVER:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${MANAGER_EMAIL:}
    password: ${MANAGER_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": ${SMTP_SSL_ENABLED:false}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS_ENABLED:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  jpa:
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8000}

app:
  policy-reminder:
    enabled: ${POLICY_REMINDER_ENABLED:false}
    from: ${MANAGER_EMAIL:}
    frontend-url: ${FRONTEND_URL:http://localhost:7001}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:7001/api/auth/callback/naver}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: am-erica
    ttl: 12h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:7001,http://127.0.0.1:7001,http://localhost:5173,http://127.0.0.1:5173}

ai:
  grpc:
    internal-key: ${AI_INTERNAL_KEY:}
    deadline: ${AI_GRPC_DEADLINE:90s}
    assistants:
      policy:
        host: ${AI_POLICY_HOST:localhost}
        port: ${AI_POLICY_PORT:50051}
        tls: ${AI_GRPC_TLS:false}
      promotion:
        host: ${AI_PROMOTION_HOST:localhost}
        port: ${AI_PROMOTION_PORT:50052}
        tls: ${AI_GRPC_TLS:false}
      customer:
        host: ${AI_CUSTOMER_HOST:localhost}
        port: ${AI_CUSTOMER_PORT:50053}
        tls: ${AI_GRPC_TLS:false}
      management:
        host: ${AI_MANAGEMENT_HOST:localhost}
        port: ${AI_MANAGEMENT_PORT:50054}
        tls: ${AI_GRPC_TLS:false}
  mock:
    enabled: false
    policy-enabled: ${AI_POLICY_MOCK_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  health:
    mail:
      enabled: ${app.policy-reminder.enabled:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
