# Python·PostgreSQL 없이 실행하는 개발용 프로필입니다.
# H2 메모리 DB를 사용하고, 4개 AI 비서는 내장 mock gRPC 서버가 응답합니다.
spring:
  datasource:
    url: jdbc:h2:mem:america;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-must-be-32-bytes-long}

ai:
  grpc:
    internal-key: ${AI_INTERNAL_KEY:local-internal-key}
  mock:
    enabled: ${AI_MOCK_ENABLED:true}
    seed-demo-data: true

management:
  endpoint:
    health:
      show-details: always
