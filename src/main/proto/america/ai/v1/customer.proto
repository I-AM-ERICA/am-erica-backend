syntax = "proto3";

package america.ai.v1;

import "america/ai/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.america.ai.v1";

// 고객 응대 AI 비서 (SCRABLE)
service CustomerAssistant {
  rpc DraftReply(ReviewReplyRequest) returns (ReviewReplyResult);
}

message ReviewReplyRequest {
  StoreContext store = 1;
  string review_text = 2;
  // 1~5, 알 수 없으면 0
  int32 rating = 3;
  string tone = 4;
}

message ReviewReplyResult {
  string reply = 1;
  // positive | neutral | negative
  string sentiment = 2;
  repeated string keywords = 3;
}
